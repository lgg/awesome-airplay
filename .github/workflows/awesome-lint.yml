name: Awesome Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  awesome-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test compatibility checker
        run: node --test tests/check-compatibility.test.mjs

      - name: Check README and compatibility matrix
        run: node scripts/check-compatibility.mjs

      - name: Run awesome-lint
        run: npx --yes awesome-lint@2.3.0
